[package]
name = "referral"
description = "WardFund Referral contract - Tracks referred users and issues reward points based on referral activity"
version = "0.0.0"
authors = ["WardFund Org <contact@wardfund.org>"]
license = "MIT"
edition.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
stellar-access = { workspace = true }
stellar-macros = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
